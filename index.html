<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso privado | IPROYEC Eventos</title>
  <link rel="icon" href="assets/favicon.ico" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="description" content="Panel privado de gestión de eventos IPROYEC Copiapó." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
  <script src="js/supabase-config.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/supabase-client.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body class="login-page">
  <main class="login-shell" aria-label="Acceso privado a eventos IPROYEC">
    <section class="login-card">
      <div class="brand-block">
        <img src="assets/logo-iproyec-2.png" alt="Logo IPROYEC" class="brand-logo" />
        <div class="brand-text">
          <strong>IPROYEC</strong>
          <span>Iglesia Proyección Cristiana</span>
        </div>
      </div>

      <h1>Panel privado de eventos</h1>
      <p class="login-intro">
        Ingresa con tu cuenta autorizada para crear eventos.
      </p>

      <p class="setup-warning error" id="configWarning" hidden></p>

      <form id="loginForm" class="login-form">
        <div class="field-group">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="admin@iproyeccopiapo.cl" required />
        </div>

        <div class="field-group">
          <label for="password">Contraseña</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required />
            <button class="toggle-password" id="togglePassword" type="button">Ver</button>
          </div>
        </div>

        <p id="formMessage" class="form-message" aria-live="polite"></p>

        <button class="btn btn-primary full" id="submitButton" type="submit">Entrar al panel</button>
      </form>
    </section>
  </main>
</body>
</html>
